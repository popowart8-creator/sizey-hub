# Add this as a separate Nginx site only after checking existing configuration.
# This is the HTTP configuration; add HTTPS with Certbot after the first release.
server {
    listen 80;
    server_name hub.sizey.ru;
    root /var/www/sizey-hub/current;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /brand/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
