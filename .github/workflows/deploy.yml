name: Build and deploy SIZEY
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_site:
        description: 'Explicitly deploy website to production after API verification'
        required: false
        type: boolean
        default: false
      deploy_catalog_api:
        description: 'Deploy the catalog API changes before publishing the admin interface'
        required: false
        type: boolean
        default: false
      deploy_qwen_api:
        description: 'Explicitly deploy Qwen API to production'
        required: false
        type: boolean
        default: false
  pull_request:
permissions:
  contents: read
concurrency:
  group: sizey-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run test:startup
      - run: npm run test:auth
      - run: npm run test:bonus-cabinet
      - run: node --test server/blog.test.mjs
      - name: Render SIZEY app icons (PNG for iOS and Android)
        run: |
          python3 -m pip install --quiet --break-system-packages cairosvg
          python3 - <<'PY'
          import cairosvg
          for size in (180,192,512):
              target='public/apple-touch-icon.png' if size==180 else f'public/icon-{size}.png'
              cairosvg.svg2png(url='public/app-icon.svg',write_to=target,output_width=size,output_height=size)
          PY
      - run: npm run build
      - run: node deploy/precompress.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sizey-dist
          path: dist/
          retention-days: 14
  inspect_local_ai:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); keys=[t for t in raw.split() if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect production capacity (read only)
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -eu
          test -n "$SSHPASS"
          command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'sh -s' <<'SH'
          echo CPU_CORES=$(nproc)
          echo MEMORY
          free -m
          echo DISK
          df -h /
          echo LOAD
          uptime
          echo CONTAINERS
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' || true
          echo OLLAMA
          command -v ollama >/dev/null && ollama --version || echo not-installed
          SH
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
  provision_local_ai:
    # Qwen was installed and verified in run 44569632640; never repeat the 2-hour transfer on PR updates.
    if: false
    needs: inspect_local_ai
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); keys=[t for t in raw.split() if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Install isolated, resource-limited Ollama for Qwen
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -eu
          test -n "$SSHPASS"
          command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'sh -s' <<'SH'
          set -eu
          available=$(awk '/MemAvailable:/{print $2}' /proc/meminfo)
          disk=$(df -Pk / | awk 'NR==2{print $4}')
          test "$available" -gt 1800000
          test "$disk" -gt 6000000
          if ! docker container inspect sizey-local-ollama >/dev/null 2>&1; then
            docker run -d --name sizey-local-ollama --restart unless-stopped --cpus=1.5 --memory=2300m --memory-swap=2800m -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 -e OLLAMA_KEEP_ALIVE=0 -v sizey-ollama-models:/root/.ollama --network bridge ollama/ollama:latest
          fi
          docker start sizey-local-ollama >/dev/null
          for i in $(seq 1 30); do
            if docker exec sizey-local-ollama ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo 'Ollama container is ready; model will be delivered from GitHub runner.'
          SH
      - name: Remove obsolete DeepSeek model from production Ollama
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -eu
          test -n "$SSHPASS"
          command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'sh -s' <<'SH'
          set -eu
          echo 'Models before cleanup:'
          docker exec sizey-local-ollama ollama list
          if docker exec sizey-local-ollama ollama list | grep -Eq '^deepseek-r1:1\\.5b[[:space:]]'; then
            docker exec sizey-local-ollama ollama rm deepseek-r1:1.5b
          fi
          echo 'Models after cleanup:'
          docker exec sizey-local-ollama ollama list
          if docker exec sizey-local-ollama ollama list | grep -Eq '^deepseek-r1:1\\.5b[[:space:]]'; then
            echo 'DeepSeek removal verification failed' >&2
            exit 1
          fi
          SH
      - name: Download model on GitHub runner and transfer via SSH
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -eu
          docker run -d --name runner-ollama -v runner-ollama-models:/root/.ollama ollama/ollama:latest
          for i in $(seq 1 40); do
            if docker exec runner-ollama ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          timeout 1200 docker exec runner-ollama ollama pull qwen2.5:1.5b
          docker exec runner-ollama ollama list
          echo 'Starting Qwen model transfer to production; large transfer may take over 45 minutes.'
          docker cp runner-ollama:/root/.ollama/. - | sshpass -e ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'docker cp - sizey-local-ollama:/root/.ollama'
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'docker exec sizey-local-ollama ollama list | grep -F qwen2.5:1.5b'
          echo 'Model transferred and verified; production API not restarted.'
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
  deploy_qwen_api:
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy_qwen_api == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'deploy-blog-api-trigger') || contains(github.event.head_commit.message, 'deploy-blog-ui-api-trigger')))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); keys=[t for t in raw.split() if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy and verify production Qwen API with rollback
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
          target="/root/sizey-qwen-api-$GITHUB_RUN_ID"
          options=(-o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes)
          sshpass -e ssh "${options[@]}" root@95.181.213.9 "umask 077; mkdir -p '$target'"
          tar --exclude=node_modules -czf - server deploy/install-local-qwen.py | sshpass -e ssh "${options[@]}" root@95.181.213.9 "tar -xzf - -C '$target'"
          sshpass -e ssh "${options[@]}" root@95.181.213.9 "python3 '$target/deploy/install-local-qwen.py'"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
  deploy:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy_site == true) || (github.event_name == 'push' && (github.event.head_commit.message == 'Deploy loyalty activation to production' || contains(github.event.head_commit.message, 'deploy-push-ui-trigger') || contains(github.event.head_commit.message, 'deploy-push-onboarding-trigger') || contains(github.event.head_commit.message, 'deploy-push-fullscreen-trigger') || contains(github.event.head_commit.message, 'deploy-push-reminders-trigger') || contains(github.event.head_commit.message, 'deploy-push-dark-trigger') || contains(github.event.head_commit.message, 'deploy-push-polish-trigger') || contains(github.event.head_commit.message, 'deploy-push-buttons-trigger') || contains(github.event.head_commit.message, 'deploy-push-3d-trigger') || contains(github.event.head_commit.message, 'deploy-push-entry-trigger') || contains(github.event.head_commit.message, 'deploy-push-lottie-trigger') || contains(github.event.head_commit.message, 'deploy-push-lottie-fix-trigger') || contains(github.event.head_commit.message, 'deploy-push-css3d-trigger') || contains(github.event.head_commit.message, 'deploy-install-button-trigger') || contains(github.event.head_commit.message, 'deploy-install-dark-art-trigger') || contains(github.event.head_commit.message, 'deploy-thin-separators-trigger') || contains(github.event.head_commit.message, 'deploy-push-icon-trigger') || contains(github.event.head_commit.message, 'deploy-app-icon-trigger') || contains(github.event.head_commit.message, 'deploy-app-icon-svg-fix-trigger') || contains(github.event.head_commit.message, 'deploy-push-adaptive-dark-trigger') || contains(github.event.head_commit.message, 'deploy-blog-ui-api-trigger') || contains(github.event.head_commit.message, 'deploy-notification-inbox-trigger'))))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sizey-dist
          path: dist
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and activate release
        env:
          DEPLOY_HOST: '95.181.213.9'
          DEPLOY_USER: sizey-deploy
        run: |
          set -eu
          release_id="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          release="/var/www/sizey-hub/releases/$release_id"
          printf '%s\n' "$release_id" > dist/version.txt
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"
          tar -C dist -czf - . | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf - -C '$release'"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /var/www/sizey-hub/assets && cp -a '$release/assets/.' /var/www/sizey-hub/assets/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "test -s '$release/index.html' && ln -sfn 'releases/$release_id' '/var/www/sizey-hub/.current-$GITHUB_SHA' && mv -Tf '/var/www/sizey-hub/.current-$GITHUB_SHA' /var/www/sizey-hub/current"
      - name: Check published application
        run: |
          set -eu
          curl --fail --silent --show-error --retry 3 https://hub.sizey.ru/ > /dev/null
          actual=$(curl --fail --silent --show-error --retry 3 "https://hub.sizey.ru/version.txt?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          test "$actual" = "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl --fail --silent --show-error --head https://hub.sizey.ru/ | grep -qi 'cache-control: no-cache'
          missing=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://hub.sizey.ru/assets/startup-missing-check.js)
          test "$missing" = 404
      - name: Remove local SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

  deploy_notifications_api:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy-notification-inbox-trigger')) || (github.event_name == 'workflow_dispatch' && inputs.deploy_catalog_api == true))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy API container without changing customer data
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
          options=(-o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes)
          target="/root/sizey-notifications-$GITHUB_RUN_ID"
          sshpass -e ssh "${options[@]}" root@95.181.213.9 "umask 077; mkdir -p '$target'"
          tar --exclude=node_modules -czf - server | sshpass -e ssh "${options[@]}" root@95.181.213.9 "tar -xzf - -C '$target'"
          sshpass -e ssh "${options[@]}" root@95.181.213.9 bash -s -- "$target" <<'REMOTE'
          set -euo pipefail
          cd /opt/sizey/hub-api
          configs=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' sizey-hub-api)
          IFS=, read -r -a files <<< "$configs"
          compose=(docker compose)
          for file in "${files[@]}"; do
            test -f "$file"
            compose+=(-f "$file")
          done
          cp -a "$1/server/." server/
          "${compose[@]}" build auth
          "${compose[@]}" up -d --no-deps auth
          REMOTE
      - name: Verify API after restart and inspect failures
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            health=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 https://hub.sizey.ru/hub-api/health || true)
            inbox=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 8 https://hub.sizey.ru/hub-api/notifications || true)
            echo "API health: $health; unauthenticated inbox: $inbox (attempt $i)"
            if [ "$health" = 200 ] && [ "$inbox" = 401 ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            options=(-o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes)
            sshpass -e ssh "${options[@]}" root@95.181.213.9 "docker inspect --format 'API container: {{.State.Status}} (restarts: {{.RestartCount}})' sizey-hub-api; docker logs --tail 35 sizey-hub-api 2>&1 | sed -E 's/(password|token|secret|authorization|cookie)([=: ]+)[^ ]+/\\1\\2[REDACTED]/Ig'" || true
            exit 1
          fi
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519

