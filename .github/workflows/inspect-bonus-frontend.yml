name: Inspect bonus frontend source securely
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Read relevant frontend source over encrypted SSH
        run: |
          printf '%s'  | base64 -d > /tmp/sizey-inspection.crt
          echo SIZEY_ENCRYPTED_SOURCE_BEGIN
          ssh -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=yes sizey-deploy@95.181.213.9 'python3 -' <<'PY' | openssl cms -encrypt -binary -aes-256-cbc -outform DER /tmp/sizey-inspection.crt | base64
          import tarfile,sys,os,io,json
          from pathlib import Path
          base=Path('/opt/sizey/app/frontend')
          with tarfile.open(fileobj=sys.stdout.buffer,mode='w|gz') as tar:
              for current,dirs,files in os.walk(base):
                  dirs[:]=[d for d in dirs if d not in ['node_modules','.git','.next','coverage']]
                  for name in files:
                      p=Path(current)/name
                      if name.startswith('.env') or p.is_symlink():continue
                      if p.suffix in ['.ts','.tsx','.js','.mjs','.cjs','.css','.json','.svg'] or name in ['Dockerfile','pnpm-lock.yaml','yarn.lock','.dockerignore']:
                          if p.stat().st_size<3000000:tar.add(p,arcname=str(p.relative_to(base)))
          PY
          echo SIZEY_ENCRYPTED_SOURCE_END
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
