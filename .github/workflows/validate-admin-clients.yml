name: Validate admin client integration
on:
  pull_request:
    paths:
      - 'src/admin/**'
      - 'server/loyalty-admin*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-admin-clients.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build admin
        run: npm run build
      - name: Verify loyalty adapter and authorization tests
        run: node --test server/loyalty-admin.test.mjs server/admin.test.mjs
