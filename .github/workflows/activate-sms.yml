name: Activate customer SMS provider
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sizey-auth-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Prepare password SSH client
        run: command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Activate SMS provider on server
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
          SMS_RU_API_ID: ${{ secrets.SMS_RU_API_ID }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          test -n "$SMS_RU_API_ID"
          sshpass -e scp -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes deploy/activate-sms.py root@95.181.213.9:/root/sizey-activate-sms.py
          printf '%s' "$SMS_RU_API_ID" | sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'python3 /root/sizey-activate-sms.py'
      - name: Check SMS service configuration
        run: |
          python3 -c 'import json,urllib.request,time; time.sleep(3); data=json.load(urllib.request.urlopen("https://hub.sizey.ru/hub-api/health",timeout=20)); assert data.get("smsConfigured") is True; print("SMS provider configured; no SMS was sent by this workflow")'
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
