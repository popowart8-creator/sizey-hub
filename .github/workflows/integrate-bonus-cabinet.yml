name: Integrate password issuance in bonus cabinet
on:
  workflow_dispatch:
    inputs:
      api_only:
        description: Update only customer API; keep published employee frontend running
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sizey-auth-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b23c7cd0ad1d1809a3f74c1e9b4febe6776154f9
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Prepare password SSH client
        run: command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Install isolated customer API
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
          API_ONLY: ${{ inputs.api_only }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          target="/root/sizey-auth-setup-$GITHUB_RUN_ID"
          options=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes)
          sshpass -e ssh "${options[@]}" root@95.181.213.9 "umask 077; mkdir -p '$target'"
          tar --exclude=node_modules --exclude=__pycache__ -czf - server deploy/install-auth.py deploy/install-bonus-cabinet.py integrations/bonus-cabinet | sshpass -e ssh "${options[@]}" root@95.181.213.9 "tar -xzf - -C '$target'"
          sshpass -e ssh "${options[@]}" root@95.181.213.9 "python3 '$target/deploy/install-auth.py'"
          if [ "$API_ONLY" != true ]; then
            sshpass -e ssh "${options[@]}" root@95.181.213.9 "python3 '$target/deploy/install-bonus-cabinet.py'"
          fi
      - name: Verify public API and employee dashboard
        run: |
          python3 -c 'import json,urllib.request; d=json.load(urllib.request.urlopen("https://hub.sizey.ru/hub-api/health",timeout=20)); assert d.get("employeeCabinetIntegration") is True; print("Employee cabinet access integration ready")'
          curl --fail --silent --show-error --max-time 20 https://app.sizey.ru/ > /dev/null
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://hub.sizey.ru/hub-api/loyalty)
          test "$status" = 401
      - name: Verify employee frontend proxy protection
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://app.sizey.ru/api/customer-access/00000000-0000-4000-8000-000000000000)
          test "$status" = 401
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
