name: Validate push notifications
on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'public/sw.js'
      - 'package*.json'
      - '.github/workflows/validate-push.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix server
      - run: node --test server/push.test.mjs
