name: Inspect free AI connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Prepare password SSH client
        run: command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Inspect public model catalog only
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'python3 -' <<'PY'
          import subprocess, json, urllib.request, urllib.error, socket, os
          print('HOST_DNS', sorted(set(x[4][0] for x in socket.getaddrinfo('openrouter.ai',443))))
          print('HOST_PROXY_NAMES', [k for k in os.environ if 'proxy' in k.lower()])
          for url in ['https://openrouter.ai/api/v1/models','https://openrouter.ai/api/v1/key']:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json'}),timeout=20)
              except urllib.error.HTTPError as e:r=e
              except Exception as e:
                  print('HOST_ERROR',type(e).__name__);continue
              body=r.read(512)
              print('HOST_HTTP', json.dumps({'path':url.rsplit('/',1)[-1],'status':r.status,'headers':{k:v for k,v in r.headers.items() if k.lower() in ['server','content-type','via','cf-ray','x-cache']},'publicError':body.decode(errors='replace') if r.status!=200 else None}))
          code="""import dns from 'node:dns/promises';console.log('CONTAINER_DNS',JSON.stringify(await dns.lookup('openrouter.ai',{all:true})));console.log('CONTAINER_PROXY_NAMES',JSON.stringify(Object.keys(process.env).filter(k=>/proxy|node_options|node_use_env_proxy/i.test(k))));for(const path of ['models','key']){try{const r=await fetch('https://openrouter.ai/api/v1/'+path,{signal:AbortSignal.timeout(15000)});const body=await r.text();console.log('CONTAINER_HTTP',JSON.stringify({path,status:r.status,headers:Object.fromEntries([...r.headers].filter(([k])=>['server','content-type','via','cf-ray','x-cache'].includes(k))),publicError:r.ok?null:body.slice(0,512),models:r.ok?JSON.parse(body).data?.length:undefined}))}catch(e){console.log('CONTAINER_ERROR',JSON.stringify({error:e.name,cause:e.cause?.code}))}}"""
          r=subprocess.run(['docker','exec','sizey-hub-api','node','--input-type=module','-e',code],capture_output=True,text=True,timeout=60)
          print(r.stdout)
          if r.returncode:print('CONTAINER_DIAGNOSTIC_FAILED',r.returncode)
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
