name: Inspect free AI connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Prepare password SSH client
        run: command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Inspect public model catalog only
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'docker exec -i sizey-hub-api node --input-type=module' <<'JS'
          import {freeModels,createDescriptionAI} from './ai-description.mjs';
          const ai=createDescriptionAI({file:'/data/ai-settings.json',secret:process.env.AUTH_SECRET,deepseekOnly:false});
          const status=await ai.status();console.log(JSON.stringify({configured:status.configured,reason:status.reason,available:status.availableModels.length}));
          try{const r=await fetch('https://openrouter.ai/api/v1/models',{signal:AbortSignal.timeout(15000)});const body=await r.text();let d;try{d=JSON.parse(body)}catch{}console.log(JSON.stringify({http:r.status,total:d?.data?.length,free:freeModels(d,{deepseekOnly:false}).length,errorType:d?.error?.code,bodyKind:body.trim().startsWith('<')?'html':'json'}))}catch(e){console.log(JSON.stringify({connectivity:e.name,cause:e.cause?.code}))}
          JS
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
