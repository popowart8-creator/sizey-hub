name: Inspect loyalty source paths
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Inspect source locations without reading secrets or customer records
        run: |
          ssh -o ConnectTimeout=20 -o BatchMode=yes -o StrictHostKeyChecking=yes sizey-deploy@95.181.213.9 'python3 -' <<'PY'
          from pathlib import Path
          import os
          print('user:', os.getuid())
          for name in ['/opt/sizey', '/opt/sizey/app', '/opt/sizey/backend', '/opt/sizey/proxy']:
              p=Path(name)
              print(name, 'exists=',p.exists(), 'readable=',os.access(p,os.R_OK), 'traversable=',os.access(p,os.X_OK))
          for current,dirs,files in os.walk('/opt/sizey',onerror=lambda e:print('unreadable directory:',e.filename)):
              dirs[:]=[d for d in dirs if d not in ['node_modules','.git','.next','data','backups'] and len(Path(current).relative_to('/opt/sizey').parts)<5]
              for name in files:
                  if name in ['package.json','schema.prisma','docker-compose.yml','compose.yml'] or name.endswith('.controller.ts'):
                      p=Path(current)/name
                      print('source:',str(p),'readable=',os.access(p,os.R_OK))
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
