name: Inspect loyalty integration readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 -c 'import os,pathlib,base64,struct; raw=os.environ["SSH_KNOWN_HOSTS"].replace("\\n","\n").replace("\r","").replace("\ufeff",""); tokens=raw.split(); keys=[t for t in tokens if t.startswith("AAAAC3NzaC1lZDI1NTE5")]; assert len(keys)==1, "SSH_KNOWN_HOSTS must contain exactly one ED25519 public host key"; key=keys[0]; decoded=base64.b64decode(key,validate=True); assert decoded[:15]==b"\x00\x00\x00\x0bssh-ed25519" and len(decoded)==51, "Invalid ED25519 host key"; pathlib.Path.home().joinpath(".ssh/known_hosts").write_text("95.181.213.9 ssh-ed25519 "+key+"\n")'
          ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Prepare password SSH client
        run: command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Inspect source locations without reading secrets or customer records
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'python3 -' <<'PY'
          from pathlib import Path
          import subprocess,json
          base=Path('/opt/sizey/app/backend/src')
          script = r"""
          const {PrismaClient}=require('@prisma/client');const {JwtService}=require('@nestjs/jwt');
          const db=new PrismaClient();
          (async()=>{
            const user=await db.user.findFirst({where:{status:'ACTIVE',role:'ADMIN'},select:{id:true,role:true}});
            if(!user)throw Error('No active administrator');
            const token=await new JwtService().signAsync({sub:user.id,role:user.role},{secret:process.env.JWT_SECRET,expiresIn:'60s'});
            const clients=await db.client.findMany({where:{deletedAt:null},select:{id:true,phoneNormalized:true}});
            const summary={};const errors=new Set();
            for(const client of clients){
              const r=await fetch('https://app.sizey.ru/api/customer-access/'+client.id,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
              summary[r.status]=(summary[r.status]||0)+1;
              if(r.status!==200){const b=await r.json();if(typeof b.message==='string')errors.add(b.message);}
            }
            console.log(JSON.stringify({checkedClientCards:clients.length,statuses:summary,errors:[...errors]}));
            const client=clients[0];const digits=client.phoneNormalized.replace(/\D/g,'');const wrongPhone='+'+digits.slice(0,-1)+((Number(digits.slice(-1))+1)%10);
            const guard=await fetch('https://app.sizey.ru/api/customer-access/'+client.id,{method:'POST',headers:{Authorization:'Bearer '+token,Origin:'https://app.sizey.ru','Content-Type':'application/json'},body:JSON.stringify({identityChecked:true,expectedPhone:wrongPhone}),signal:AbortSignal.timeout(20000)});
            const guardBody=await guard.json();console.log(JSON.stringify({passwordPostGuardStatus:guard.status,message:guardBody.message}));
            if(guard.status!==409)throw Error('Unexpected password route result');

            const r=await fetch('https://api.sizey.ru/api/clients?all=true',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const body=await r.json(); console.log(JSON.stringify({directoryStatus:r.status,directoryCount:Array.isArray(body)?body.length:null,expectedCount:clients.length}));
          })().catch(()=>{console.error('Authenticated diagnostic failed');process.exitCode=1}).finally(()=>db.$disconnect());
          """
          result=subprocess.run(['docker','exec','-i','sizey-prod-backend','node'],input=script,capture_output=True,text=True,timeout=300)
          print(result.stdout)
          assert result.returncode==0, 'Read-only authenticated diagnostic failed'
          # Aggregate counts only, no customer data exported.
          pg=json.loads(subprocess.check_output(['docker','inspect','sizey-prod-postgres']))[0]
          env=dict(x.split('=',1) for x in pg['Config']['Env'])
          query="SELECT 'clients='||COUNT(*) FROM clients WHERE deleted_at IS NULL; SELECT 'duplicate_phone_groups='||COUNT(*) FROM (SELECT phone_normalized FROM clients WHERE deleted_at IS NULL GROUP BY phone_normalized HAVING COUNT(*)>1) x;"
          r=subprocess.run(['docker','exec','sizey-prod-postgres','psql','-U',env['POSTGRES_USER'],'-d',env['POSTGRES_DB'],'-At','-c',query],capture_output=True,text=True)
          print('AGGREGATE_STATUS',r.returncode)
          if r.returncode==0:print(r.stdout)
          PY
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
