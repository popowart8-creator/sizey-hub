name: Inspect production loyalty API contracts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-loyalty-contracts.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          python3 - <<'PY'
          import os,pathlib,base64
          raw=os.environ['SSH_KNOWN_HOSTS'].replace('\\n','\n').replace('\r','').replace('\ufeff','')
          keys=[t for t in raw.split() if t.startswith('AAAAC3NzaC1lZDI1NTE5')]
          assert len(keys)==1
          key=keys[0]
          decoded=base64.b64decode(key,validate=True)
          assert decoded[:15]==b'\x00\x00\x00\x0bssh-ed25519' and len(decoded)==51
          pathlib.Path.home().joinpath('.ssh/known_hosts').write_text('95.181.213.9 ssh-ed25519 '+key+'\n')
          PY
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Install SSH password client
        run: command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y -qq sshpass)
      - name: Read API controller and DTO declarations only
        env:
          SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSHPASS"
          sshpass -e ssh -o ConnectTimeout=20 -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=yes root@95.181.213.9 'python3 -' <<'PY'
          from pathlib import Path
          import re
          root=Path('/opt/sizey/app/backend/src')
          assert root.is_dir(), 'Backend source directory unavailable'
          folders=('clients','users','sales','bonus','settings','auth')
          for folder in folders:
              directory=root/folder
              if not directory.is_dir():
                  continue
              for path in sorted(directory.rglob('*.ts')):
                  if not (path.name.endswith('.controller.ts') or path.name.endswith('.dto.ts') or '/dto/' in str(path)):
                      continue
                  if len(path.relative_to(root).parts)>6 or path.stat().st_size>80000:
                      continue
                  print('FILE',path.relative_to(root))
                  for number,line in enumerate(path.read_text(errors='replace').splitlines(),1):
                      s=line.strip()
                      if re.match(r'^@(Controller|Get|Post|Patch|Put|Delete|Roles|UseGuards|ApiOperation|ApiBody|ApiParam|ApiQuery|IsString|IsOptional|IsUUID|IsNumber|IsInt|IsEnum|Min|Max|ValidateNested|IsBoolean|IsArray)\b',s) or re.match(r'^(export )?(class|enum)\s+',s) or re.match(r'^(readonly )?[a-zA-Z_][a-zA-Z0-9_?]*\s*[!:]\s*[a-zA-Z_][a-zA-Z0-9_<>, |\[\]?]*\s*;',s):
                          print(f'{number}: {s[:180]}')
          PY
      - name: Clean SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
